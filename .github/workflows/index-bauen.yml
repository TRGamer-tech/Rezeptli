name: Rezeptindex

on:
  schedule:
    # Nachts um vier, wenn bei den Anbietern wenig los ist.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      nur_pruefen:
        description: 'Nur bauen und die Quellen pruefen, nichts veroeffentlichen'
        type: boolean
        default: false

# Nur zum Veröffentlichen auf GitHub Pages - kein Schreibzugriff auf das Repository.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rezeptindex
  cancel-in-progress: false

jobs:
  bauen:
    name: Index bauen und veröffentlichen
    runs-on: ubuntu-latest
    if: inputs.nur_pruefen != true

    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichen.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Index bauen
        run: |
          set -o pipefail
          python3 tools/index-bauen.py 2>&1 | tee /tmp/index.log

      - name: Seite zusammenstellen
        run: |
          # Die Website liegt an der Wurzel, der Rezeptindex darunter. Vorher hat
          # dieser Workflow nur den Index hochgeladen - und damit die Website
          # ueberschrieben, was rezeptli.app einen 404 lieferte.
          mkdir -p build/pages
          cp -r site/. build/pages/
          mkdir -p build/pages/index
          cp build/index/* build/pages/index/

          echo "Veroeffentlicht wird:"
          find build/pages -maxdepth 2 -type f -printf '  %P (%s Bytes)\n' | sort

          # Ohne index.html an der Wurzel antwortet Pages mit 404 - genau der Fehler,
          # der hier behoben wird. Also pruefen, bevor hochgeladen wird.
          test -f build/pages/index.html || { echo "::error::index.html fehlt"; exit 1; }
          test -f build/pages/CNAME || { echo "::error::CNAME fehlt"; exit 1; }

      - name: Ergebnis zusammenfassen
        if: always()
        run: |
          {
            echo '## Rezeptindex'
            echo
            if [ -f build/index/manifest.json ]; then
              echo '| Quelle | Rezepte | Grösse |'
              echo '|---|---:|---:|'
              python3 - <<'PY'
          import json
          daten = json.load(open("build/index/manifest.json"))
          for kennung, werte in sorted(daten["quellen"].items()):
              kb = werte["groesseBytes"] // 1024
              print(f"| {kennung} | {werte['eintraege']} | {kb} KB |")
          gesamt = sum(w["eintraege"] for w in daten["quellen"].values())
          groesse = sum(w["groesseBytes"] for w in daten["quellen"].values()) // 1024
          print(f"\n**{gesamt} Rezepte, {groesse} KB insgesamt**")
          PY
            else
              echo 'Der Index konnte nicht gebaut werden.'
            fi
            echo
            echo '<details><summary>Protokoll</summary>'
            echo
            echo '```'
            cat /tmp/index.log
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pages einrichten
        uses: actions/configure-pages@v5

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

      - name: Veröffentlichen
        id: veroeffentlichen
        uses: actions/deploy-pages@v4

      - name: Jede Quelle auf Inhalt prüfen
        run: |
          set -o pipefail
          python3 tools/index-pruefen.py 2>&1 | tee /tmp/quellenpruefung.txt

      - name: Quellenpruefung anhängen
        if: always()
        run: |
          {
            echo '### Quellen im Index'
            echo
            echo '```'
            cat /tmp/quellenpruefung.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prüfen, ob die Seite wirklich etwas anzeigt
        run: |
          # Ein erfolgreicher Deploy ist kein Beweis, dass die Seite laedt. Die
          # Startseite entpackt sich selbst per JavaScript, deshalb wird hier
          # geprueft, dass die Bundle-Daten wirklich ankommen - nicht nur ein
          # HTTP 200 auf irgendwas.
          BASIS="${{ steps.veroeffentlichen.outputs.page_url }}"
          BASIS="${BASIS%/}"
          echo "Prüfe $BASIS"

          fehler=0
          pruefe() {
            pfad="$1"; muster="$2"; beschreibung="$3"
            code=$(curl -sSL -o /tmp/seite -w '%{http_code}' "$BASIS$pfad" || echo 000)
            if [ "$code" != "200" ]; then
              echo "  FEHLER $pfad: HTTP $code"
              fehler=1
            elif ! grep -q "$muster" /tmp/seite; then
              echo "  FEHLER $pfad: HTTP 200, aber $beschreibung fehlt"
              fehler=1
            else
              echo "  ok $pfad ($(stat -c%s /tmp/seite) Bytes, $beschreibung vorhanden)"
            fi
          }

          pruefe "/" '__bundler/template' "die Bundle-Daten"
          pruefe "/Datenschutz.html" '__bundler/template' "die Bundle-Daten"
          pruefe "/index/manifest.json" 'gebautAm' "das Manifest"

          {
            echo "### Website"
            echo
            echo "Adresse: $BASIS"
            [ "$fehler" = "0" ] && echo "Startseite, Datenschutz und Index liefern Inhalt." \
              || echo "**Es fehlt etwas — siehe Protokoll.**"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $fehler

  pruefen:
    name: Quellen prüfen, ohne zu veröffentlichen
    runs-on: ubuntu-latest
    # Die Pages-Umgebung laesst nur den Hauptzweig veroeffentlichen. Dieser Job
    # braucht sie nicht: Er baut den Index und schaut nach, ob jede Quelle etwas
    # geliefert hat. So laesst sich eine Quelle auf einem Zweig nachweisen, ohne
    # die Website anzufassen.
    if: inputs.nur_pruefen == true
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Index bauen
        run: |
          set -o pipefail
          python3 tools/index-bauen.py 2>&1 | tee /tmp/index.log

      - name: Jede Quelle auf Inhalt prüfen
        run: |
          set -o pipefail
          python3 tools/index-pruefen.py 2>&1 | tee /tmp/quellenpruefung.txt

      - name: Bericht anhängen
        if: always()
        run: |
          {
            echo '## Quellen im Index'
            echo
            echo '```'
            cat /tmp/quellenpruefung.txt 2>/dev/null || echo 'keine Pruefung gelaufen'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
