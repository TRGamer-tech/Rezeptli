name: Pairing-Dienst

on:
  push:
    branches: [main]
    paths:
      - 'pairing/**'
      - '.github/workflows/pairing-deploy.yml'
  pull_request:
    paths:
      - 'pairing/**'
  workflow_dispatch:

# Der Dienst braucht nur Lesezugriff auf das Repository. Das Cloudflare-Token
# kommt aus den Secrets und steht nirgends im Projekt.
permissions:
  contents: read

concurrency:
  group: pairing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Typen und Schema prüfen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Abhängigkeiten installieren
        working-directory: pairing
        run: npm install --no-audit --no-fund

      - name: Typen prüfen
        working-directory: pairing
        run: npm run typecheck

      - name: Treffer-Logik prüfen
        run: |
          # Laeuft gegen eine echte SQLite-Datenbank mit dem echten Schema und
          # der Abfrage, die auch der Dienst verwendet. D1 spricht SQLite.
          python3 pairing/tests/treffer_test.py

  veroeffentlichen:
    name: Auf Cloudflare veröffentlichen
    runs-on: ubuntu-latest
    needs: pruefen
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Abhängigkeiten installieren
        working-directory: pairing
        run: npm install --no-audit --no-fund

      - name: Datenbank migrieren
        working-directory: pairing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply rezeptli-pairing --remote

      - name: Dienst veröffentlichen
        id: deploy
        working-directory: pairing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log

          # wrangler nennt die veroeffentlichte Adresse im Protokoll. Sie hier
          # herauszuziehen ist verlaesslicher als sie zu erraten - der
          # workers.dev-Namensraum haengt am Konto, nicht am Projekt.
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Erreichbarkeit prüfen
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$URL" ]; then
            echo "::warning::Keine Adresse im Protokoll gefunden - bitte im Dashboard nachsehen."
            exit 0
          fi

          echo "Dienst läuft unter: $URL"
          # Kurz warten, bis die Veroeffentlichung ueberall angekommen ist.
          for versuch in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/antwort.json -w '%{http_code}' "$URL/gesundheit" || echo 000)
            [ "$code" = "200" ] && break
            echo "  Versuch $versuch: HTTP $code, warte..."
            sleep 5
          done

          {
            echo "### Pairing-Dienst"
            echo
            echo "Adresse: \`$URL\`"
            echo
            if [ "$code" = "200" ]; then
              echo "Erreichbar, Antwort: \`$(cat /tmp/antwort.json)\`"
              echo
              echo 'Diese Adresse gehört in \`app/build.gradle.kts\` unter \`PAIRING_URL\`.'
            else
              echo "**Nicht erreichbar** (HTTP $code)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$code" = "200" ]
