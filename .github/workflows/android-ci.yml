name: Android CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      aufgabe:
        description: 'Was soll laufen?'
        type: choice
        default: apk
        options:
          - apk
          - quellen-pruefen

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build und Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Code-Style prüfen (ktlint)
        run: ./gradlew ktlintCheck --stacktrace

      - name: Unit-Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug --stacktrace

      - name: Testergebnis zusammenfassen
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET

          total = failures = skipped = 0
          rows = []
          for path in glob.glob("app/build/test-results/**/TEST-*.xml", recursive=True):
              root = ET.parse(path).getroot()
              tests = int(root.get("tests", 0))
              failed = int(root.get("failures", 0)) + int(root.get("errors", 0))
              total += tests
              failures += failed
              skipped += int(root.get("skipped", 0))
              rows.append((root.get("name"), tests, failed))

          print("## Unit-Tests\n")
          print("| Testklasse | Tests | Fehler |")
          print("|---|---:|---:|")
          for name, tests, failed in sorted(rows):
              print(f"| {name} | {tests} | {failed} |")
          print(f"\n**{total} Tests, {failures} Fehler, {skipped} uebersprungen**")
          PY

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Room-Schema auf Abweichungen prüfen
        run: |
          # Room exportiert das Schema bei jedem Build nach app/schemas/. Sobald die
          # Datei eingecheckt ist, muss jede Schema-Aenderung mitcommittet werden -
          # sonst laesst sich spaeter keine Migration mehr gegen sie testen.
          # Solange sie noch nicht eingecheckt ist (--untracked-files=no), stoert das nicht.
          drift="$(git status --porcelain --untracked-files=no app/schemas)"
          if [ -n "$drift" ]; then
            echo "::error::Das exportierte Room-Schema weicht vom eingecheckten Stand ab."
            echo "$drift"
            git --no-pager diff -- app/schemas
            exit 1
          fi

      - name: Room-Schema hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: app/schemas/
          if-no-files-found: warn
          retention-days: 14

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: rezeptli-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: UI-Tests kompilieren
        run: ./gradlew assembleDebugAndroidTest --console=plain

  instrumented:
    name: UI-Tests auf dem Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: KVM freigeben
        run: |
          # Ohne Hardware-Beschleunigung braucht der Emulator ein Vielfaches der Zeit.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentierte Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --console=plain

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7

  publish-apk:
    name: Debug-APK veröffentlichen
    runs-on: ubuntu-latest
    # Laeuft bewusst nur auf Zuruf: bei jedem Push waere ein Release blosses Rauschen.
    if: github.event_name == 'workflow_dispatch' && inputs.aufgabe == 'apk'
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug --console=plain

      - name: APK benennen
        id: apk
        run: |
          version="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          target="rezeptli-${version}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$target"
          echo "name=$target" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          sha256sum "$target"

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: apk-debug
          APK: ${{ steps.apk.outputs.name }}
          VERSION: ${{ steps.apk.outputs.version }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          notes=$(cat <<NOTES
          **Debug-Build zum Ausprobieren - kein fertiges Release.**

          Diese APK ist mit dem Android-Debug-Schlüssel signiert und nicht optimiert.
          Sie ist zum Testen gedacht, nicht zur Weitergabe.

          - Version: \`$VERSION\`
          - Paketname: \`ch.rezeptli.app.debug\` (läuft parallel zu einem späteren Release-Build)
          - Stand: \`$COMMIT\`

          **Installation:** APK auf dem Handy herunterladen und öffnen. Android fragt einmalig,
          ob Browser bzw. Datei-Manager Apps installieren dürfen - das muss erlaubt werden.

          Die App hat keine Internet-Berechtigung: alle Rezepte bleiben auf dem Gerät.
          NOTES
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes "$notes" --prerelease
          else
            gh release create "$TAG" "$APK" \
              --title "Rezeptli $VERSION (Debug-Build)" \
              --notes "$notes" \
              --prerelease
          fi

          {
            echo "### APK bereit"
            echo "https://github.com/$REPO/releases/download/$TAG/$APK"
          } >> "$GITHUB_STEP_SUMMARY"

  quellen-pruefen:
    name: Rezeptquellen analysieren
    runs-on: ubuntu-latest
    # Einmalige Analyse: Bieten die Schweizer Rezeptseiten strukturierte Daten
    # (schema.org/Recipe als JSON-LD) an? Davon haengt ab, wie der Import gebaut wird.
    if: github.event_name == 'workflow_dispatch' && inputs.aufgabe == 'quellen-pruefen'

    steps:
      - name: Seiten analysieren
        run: |
          set +e
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'
          fetch() { curl -sSL --max-time 40 -A "$UA" "$1"; }

          for host in https://www.swissmilk.ch https://fooby.ch https://migusto.migros.ch; do
            echo "=================== $host ==================="
            echo "--- robots.txt (Auszug) ---"
            fetch "$host/robots.txt" | head -30
            echo "--- Startseite: Status und Rezept-Links ---"
            fetch "$host" > /tmp/home.html
            echo "Bytes: $(wc -c < /tmp/home.html)"
            grep -oE 'href="[^"]{0,120}(rezept|recipe)[^"]{0,80}"' /tmp/home.html \
              | sort -u | head -8
            echo "--- JSON-LD auf der Startseite? ---"
            grep -c 'application/ld+json' /tmp/home.html
          done

          echo "=================== Rezeptseite im Detail ==================="
          # Erste Rezept-URL von Swissmilk aufloesen und auf strukturierte Daten pruefen.
          fetch https://www.swissmilk.ch/de/rezepte-kochideen/ > /tmp/list.html
          echo "Listenseite Bytes: $(wc -c < /tmp/list.html)"
          url=$(grep -oE 'href="[^"]*/rezepte/[^"]*"' /tmp/list.html | head -1 \
            | sed 's/href="//; s/"$//')
          echo "Gefundene Rezept-URL: $url"
          case "$url" in
            /*) url="https://www.swissmilk.ch$url" ;;
          esac
          if [ -n "$url" ]; then
            fetch "$url" > /tmp/recipe.html
            echo "Rezeptseite Bytes: $(wc -c < /tmp/recipe.html)"
            echo "--- Anzahl JSON-LD-Bloecke ---"
            grep -c 'application/ld+json' /tmp/recipe.html
            echo "--- JSON-LD Inhalt (gekuerzt) ---"
            python3 - <<'PYEOF'
          import json, re
          html = open('/tmp/recipe.html', encoding='utf-8', errors='replace').read()
          blocks = re.findall(
              r'<script[^>]*application/ld\+json[^>]*>(.*?)</script>', html, re.S)
          print("Bloecke:", len(blocks))
          for raw in blocks:
              try:
                  data = json.loads(raw)
              except Exception as exc:
                  print("  nicht parsebar:", exc)
                  continue
              for node in (data if isinstance(data, list) else [data]):
                  if isinstance(node, dict) and 'Recipe' in str(node.get('@type', '')):
                      print("  RECIPE GEFUNDEN. Felder:", sorted(node.keys()))
                      for key in ('name', 'recipeYield', 'totalTime', 'prepTime', 'cookTime'):
                          print(f"   {key}: {json.dumps(node.get(key), ensure_ascii=False)[:120]}")
                      ing = node.get('recipeIngredient') or node.get('ingredients')
                      print("   recipeIngredient (erste 6):",
                            json.dumps(ing[:6] if isinstance(ing, list) else ing,
                                       ensure_ascii=False)[:400])
                      instr = node.get('recipeInstructions')
                      print("   recipeInstructions Typ:", type(instr).__name__)
                      print("   recipeInstructions:",
                            json.dumps(instr, ensure_ascii=False)[:400])
                      print("   image:", json.dumps(node.get('image'), ensure_ascii=False)[:200])
                  elif isinstance(node, dict):
                      print("  anderer Typ:", node.get('@type'))
          PYEOF
          fi
          exit 0
