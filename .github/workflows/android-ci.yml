name: Android CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      aufgabe:
        description: 'Was soll laufen?'
        type: choice
        default: apk
        options:
          - apk
          - quellen-pruefen

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build und Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Code-Style prüfen (ktlint)
        run: ./gradlew ktlintCheck --stacktrace

      - name: Unit-Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug --stacktrace

      - name: Testergebnis zusammenfassen
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET

          total = failures = skipped = 0
          rows = []
          for path in glob.glob("app/build/test-results/**/TEST-*.xml", recursive=True):
              root = ET.parse(path).getroot()
              tests = int(root.get("tests", 0))
              failed = int(root.get("failures", 0)) + int(root.get("errors", 0))
              total += tests
              failures += failed
              skipped += int(root.get("skipped", 0))
              rows.append((root.get("name"), tests, failed))

          print("## Unit-Tests\n")
          print("| Testklasse | Tests | Fehler |")
          print("|---|---:|---:|")
          for name, tests, failed in sorted(rows):
              print(f"| {name} | {tests} | {failed} |")
          print(f"\n**{total} Tests, {failures} Fehler, {skipped} uebersprungen**")
          PY

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Room-Schema auf Abweichungen prüfen
        run: |
          # Room exportiert das Schema bei jedem Build nach app/schemas/. Sobald die
          # Datei eingecheckt ist, muss jede Schema-Aenderung mitcommittet werden -
          # sonst laesst sich spaeter keine Migration mehr gegen sie testen.
          # Solange sie noch nicht eingecheckt ist (--untracked-files=no), stoert das nicht.
          drift="$(git status --porcelain --untracked-files=no app/schemas)"
          if [ -n "$drift" ]; then
            echo "::error::Das exportierte Room-Schema weicht vom eingecheckten Stand ab."
            echo "$drift"
            git --no-pager diff -- app/schemas
            exit 1
          fi

      - name: Room-Schema hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: app/schemas/
          if-no-files-found: warn
          retention-days: 14

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: rezeptli-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: UI-Tests kompilieren
        run: ./gradlew assembleDebugAndroidTest --console=plain

  instrumented:
    name: UI-Tests auf dem Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: KVM freigeben
        run: |
          # Ohne Hardware-Beschleunigung braucht der Emulator ein Vielfaches der Zeit.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentierte Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --console=plain

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7

  publish-apk:
    name: Debug-APK veröffentlichen
    runs-on: ubuntu-latest
    # Laeuft bewusst nur auf Zuruf: bei jedem Push waere ein Release blosses Rauschen.
    if: github.event_name == 'workflow_dispatch' && inputs.aufgabe == 'apk'
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug --console=plain

      - name: APK benennen
        id: apk
        run: |
          version="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          target="rezeptli-${version}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$target"
          echo "name=$target" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          sha256sum "$target"

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: apk-debug
          APK: ${{ steps.apk.outputs.name }}
          VERSION: ${{ steps.apk.outputs.version }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          notes=$(cat <<NOTES
          **Debug-Build zum Ausprobieren - kein fertiges Release.**

          Diese APK ist mit dem Android-Debug-Schlüssel signiert und nicht optimiert.
          Sie ist zum Testen gedacht, nicht zur Weitergabe.

          - Version: \`$VERSION\`
          - Paketname: \`ch.rezeptli.app.debug\` (läuft parallel zu einem späteren Release-Build)
          - Stand: \`$COMMIT\`

          **Installation:** APK auf dem Handy herunterladen und öffnen. Android fragt einmalig,
          ob Browser bzw. Datei-Manager Apps installieren dürfen - das muss erlaubt werden.

          Die App hat keine Internet-Berechtigung: alle Rezepte bleiben auf dem Gerät.
          NOTES
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes "$notes" --prerelease
          else
            gh release create "$TAG" "$APK" \
              --title "Rezeptli $VERSION (Debug-Build)" \
              --notes "$notes" \
              --prerelease
          fi

          {
            echo "### APK bereit"
            echo "https://github.com/$REPO/releases/download/$TAG/$APK"
          } >> "$GITHUB_STEP_SUMMARY"

  quellen-pruefen:
    name: Rezeptquellen analysieren
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.aufgabe == 'quellen-pruefen'

    steps:
      - name: Seiten analysieren
        run: |
          set +e
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'
          fetch() { curl -sSL --max-time 40 -A "$UA" "$1"; }

          echo "########## Swissmilk robots.txt (Kopf) ##########"
          fetch https://www.swissmilk.ch/robots.txt | head -25

          echo "########## Swissmilk Rezeptseite ##########"
          fetch "https://www.swissmilk.ch/de/rezepte-kochideen/rezepte/SM2024_DIVE_80/aprikosen-blechkuchen/" > /tmp/sm.html
          echo "########## Migusto Rezeptseite ##########"
          fetch "https://migusto.migros.ch/de/rezepte/feta-pasta" > /tmp/mi.html
          echo "########## Fooby Rezeptseite ##########"
          fetch "https://fooby.ch/de/rezepte.html" > /tmp/fb-list.html
          fb=$(grep -oE 'href="[^"]*/rezepte/[^"]*\.html"' /tmp/fb-list.html | head -1 | sed 's/href="//; s/"$//')
          echo "Fooby-Rezept: $fb"
          case "$fb" in /*) fb="https://fooby.ch$fb" ;; esac
          fetch "$fb" > /tmp/fb.html

          python3 - <<'PYEOF'
          import json, re

          def blocks(path):
              html = open(path, encoding='utf-8', errors='replace').read()
              return html, re.findall(
                  r'<script[^>]*application/ld\+json[^>]*>(.*?)</script>', html, re.S)

          def walk(node, depth=0):
              """Alle @type-Werte samt Feldern ausgeben, auch in @graph verschachtelt."""
              if isinstance(node, list):
                  for n in node:
                      walk(n, depth)
                  return
              if not isinstance(node, dict):
                  return
              t = node.get('@type')
              if t:
                  print("  " * depth, "@type:", t, "| Felder:", sorted(node.keys())[:14])
              for key in ('@graph', 'mainEntity', 'itemListElement'):
                  if key in node:
                      print("  " * depth, f"-> {key}:")
                      walk(node[key], depth + 1)

          for name, path in (("SWISSMILK", "/tmp/sm.html"),
                             ("MIGUSTO", "/tmp/mi.html"),
                             ("FOOBY", "/tmp/fb.html")):
              print("=" * 25, name, "=" * 25)
              html, raws = blocks(path)
              print("HTML-Bytes:", len(html), "| JSON-LD-Bloecke:", len(raws))
              for raw in raws:
                  try:
                      walk(json.loads(raw))
                  except Exception as exc:
                      print("  nicht parsebar:", str(exc)[:80])
              # Eingebettete Zustandsdaten von JavaScript-Frontends
              for marker in ('__NEXT_DATA__', '__NUXT__', 'window.__INITIAL_STATE__',
                             'application/json'):
                  if marker in html:
                      print("  Marker gefunden:", marker)
              # Zutaten-Hinweise im HTML
              for pat in ('itemprop="recipeIngredient"', 'recipeIngredient',
                          'ingredient', 'Zutaten'):
                  print(f"  '{pat}':", html.count(pat))

          print("=" * 25, "SWISSMILK HowTo im Detail", "=" * 25)
          _, raws = blocks("/tmp/sm.html")
          for raw in raws:
              try:
                  data = json.loads(raw)
              except Exception:
                  continue
              for node in (data if isinstance(data, list) else [data]):
                  if isinstance(node, dict) and node.get('@type') == 'HowTo':
                      print(json.dumps(node, ensure_ascii=False)[:2500])
          PYEOF
          exit 0
