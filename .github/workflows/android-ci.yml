name: Android CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      aufgabe:
        description: 'Was soll laufen?'
        type: choice
        default: apk
        options:
          - apk
          - quellen-pruefen

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build und Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Code-Style prüfen (ktlint)
        run: ./gradlew ktlintCheck --stacktrace

      - name: Unit-Tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --console=plain 2>&1 | tee /tmp/build.log

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug --stacktrace

      - name: Testergebnis zusammenfassen
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET

          total = failures = skipped = 0
          rows = []
          for path in glob.glob("app/build/test-results/**/TEST-*.xml", recursive=True):
              root = ET.parse(path).getroot()
              tests = int(root.get("tests", 0))
              failed = int(root.get("failures", 0)) + int(root.get("errors", 0))
              total += tests
              failures += failed
              skipped += int(root.get("skipped", 0))
              rows.append((root.get("name"), tests, failed))

          print("## Unit-Tests\n")
          print("| Testklasse | Tests | Fehler |")
          print("|---|---:|---:|")
          for name, tests, failed in sorted(rows):
              print(f"| {name} | {tests} | {failed} |")
          print(f"\n**{total} Tests, {failures} Fehler, {skipped} uebersprungen**")
          PY

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Room-Schema auf Abweichungen prüfen
        run: |
          # Room exportiert das Schema bei jedem Build nach app/schemas/. Sobald die
          # Datei eingecheckt ist, muss jede Schema-Aenderung mitcommittet werden -
          # sonst laesst sich spaeter keine Migration mehr gegen sie testen.
          # Solange sie noch nicht eingecheckt ist (--untracked-files=no), stoert das nicht.
          drift="$(git status --porcelain --untracked-files=no app/schemas)"
          if [ -n "$drift" ]; then
            echo "::error::Das exportierte Room-Schema weicht vom eingecheckten Stand ab."
            echo "$drift"
            git --no-pager diff -- app/schemas
            exit 1
          fi

      - name: Room-Schema hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: app/schemas/
          if-no-files-found: warn
          retention-days: 14

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: rezeptli-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: UI-Tests kompilieren
        run: |
          set -o pipefail
          ./gradlew assembleDebugAndroidTest --console=plain 2>&1 | tee -a /tmp/build.log

      # Steht bewusst am Schluss: So sind Kompilierfehler am Ende des Logs zu finden
      # und nicht zwischen Artefakt-Uploads.
      - name: Fehler zusammenfassen
        if: failure()
        run: |
          echo "=== Kompilier- und Testfehler ==="
          grep -E "^e: |^w: .*error|FAILED$" /tmp/build.log | head -40 || echo "keine gefunden"
          echo "=== Fehlgeschlagene Tests ==="
          grep -E "FAILED" /tmp/build.log | head -20 || true

  instrumented:
    name: UI-Tests auf dem Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: KVM freigeben
        run: |
          # Ohne Hardware-Beschleunigung braucht der Emulator ein Vielfaches der Zeit.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentierte Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --console=plain

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7

  publish-apk:
    name: Debug-APK veröffentlichen
    runs-on: ubuntu-latest
    # Laeuft bewusst nur auf Zuruf: bei jedem Push waere ein Release blosses Rauschen.
    if: github.event_name == 'workflow_dispatch' && inputs.aufgabe == 'apk'
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug --console=plain

      - name: APK benennen
        id: apk
        run: |
          version="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          target="rezeptli-${version}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$target"
          echo "name=$target" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          sha256sum "$target"

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: apk-debug
          APK: ${{ steps.apk.outputs.name }}
          VERSION: ${{ steps.apk.outputs.version }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          notes=$(cat <<NOTES
          **Debug-Build zum Ausprobieren - kein fertiges Release.**

          Diese APK ist mit dem Android-Debug-Schlüssel signiert und nicht optimiert.
          Sie ist zum Testen gedacht, nicht zur Weitergabe.

          - Version: \`$VERSION\`
          - Paketname: \`ch.rezeptli.app.debug\` (läuft parallel zu einem späteren Release-Build)
          - Stand: \`$COMMIT\`

          **Installation:** APK auf dem Handy herunterladen und öffnen. Android fragt einmalig,
          ob Browser bzw. Datei-Manager Apps installieren dürfen - das muss erlaubt werden.

          Die App hat keine Internet-Berechtigung: alle Rezepte bleiben auf dem Gerät.
          NOTES
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes "$notes" --prerelease
          else
            gh release create "$TAG" "$APK" \
              --title "Rezeptli $VERSION (Debug-Build)" \
              --notes "$notes" \
              --prerelease
          fi

          {
            echo "### APK bereit"
            echo "https://github.com/$REPO/releases/download/$TAG/$APK"
          } >> "$GITHUB_STEP_SUMMARY"

  quellen-pruefen:
    name: Rezeptquellen analysieren
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.aufgabe == 'quellen-pruefen'

    steps:
      - name: Quellen analysieren
        run: |
          cat > /tmp/recon.py <<'PYEOF'
          import gzip, io, json, re, urllib.request, urllib.error

          UA = ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/120.0 Safari/537.36")
          SITES = [
              "https://www.bettybossi.ch", "https://www.swissmilk.ch",
              "https://www.gutekueche.ch", "https://migusto.migros.ch",
              "https://fooby.ch", "https://bettyskuechenschaetze.ch",
              "https://lemenu.ch", "https://www.chefkoch.de",
          ]
          RECIPE_HINT = re.compile(r"rezept|recipe|recette|ricetta", re.I)

          def get(url, limit=4_000_000):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=45) as resp:
                  raw = resp.read(limit)
              if raw[:2] == b"\x1f\x8b":
                  raw = gzip.GzipFile(fileobj=io.BytesIO(raw)).read()
              return raw.decode("utf-8", "replace")

          def types_of(node, out):
              if isinstance(node, list):
                  for n in node:
                      types_of(n, out)
              elif isinstance(node, dict):
                  t = node.get("@type")
                  if t:
                      out.add(t if isinstance(t, str) else "/".join(map(str, t)))
                  for key in ("@graph", "mainEntity", "itemListElement"):
                      if key in node:
                          types_of(node[key], out)

          def find_recipe(node):
              if isinstance(node, list):
                  for n in node:
                      r = find_recipe(n)
                      if r:
                          return r
              elif isinstance(node, dict):
                  if "Recipe" in str(node.get("@type", "")):
                      return node
                  for key in ("@graph", "mainEntity"):
                      if key in node:
                          r = find_recipe(node[key])
                          if r:
                              return r
              return None

          for site in SITES:
              print("=" * 20, site, "=" * 20)
              # robots.txt
              sitemaps, disallows, delay = [], [], None
              try:
                  robots = get(site + "/robots.txt", 200_000)
                  active = False
                  for line in robots.splitlines():
                      low = line.strip().lower()
                      if low.startswith("user-agent:"):
                          active = low.split(":", 1)[1].strip() == "*"
                      elif low.startswith("sitemap:"):
                          sitemaps.append(line.split(":", 1)[1].strip())
                      elif active and low.startswith("disallow:"):
                          disallows.append(low.split(":", 1)[1].strip())
                      elif active and low.startswith("crawl-delay:"):
                          delay = low.split(":", 1)[1].strip()
                  blocking = [d for d in disallows if d and RECIPE_HINT.search(d)]
                  print(f"robots: {len(disallows)} Disallow, crawl-delay={delay}, "
                        f"Sitemaps={len(sitemaps)}")
                  print(f"  Disallow mit Rezept-Bezug: {blocking or 'keine'}")
              except Exception as exc:
                  print("robots FEHLER:", str(exc)[:90])

              # Sitemap -> Rezept-URLs
              recipe_urls = []
              for sm in sitemaps[:6]:
                  try:
                      xml = get(sm)
                  except Exception:
                      continue
                  locs = re.findall(r"<loc>\s*([^<\s]+)\s*</loc>", xml)
                  if "<sitemapindex" in xml:
                      child = next((l for l in locs if RECIPE_HINT.search(l)), None) or (locs[0] if locs else None)
                      if child:
                          try:
                              locs = re.findall(r"<loc>\s*([^<\s]+)\s*</loc>", get(child))
                          except Exception:
                              locs = []
                  hits = [l for l in locs if RECIPE_HINT.search(l)]
                  if hits:
                      print(f"  Sitemap {sm.split('/')[-1]}: {len(locs)} URLs, "
                            f"{len(hits)} mit Rezept-Bezug")
                      print(f"    Beispiel: {hits[0]}")
                      recipe_urls = hits
                      break

              if not recipe_urls:
                  print("  keine Rezept-URLs ueber Sitemap gefunden")
                  continue

              # Rezeptseite analysieren
              try:
                  html = get(recipe_urls[len(recipe_urls) // 2])
              except Exception as exc:
                  print("  Rezeptseite FEHLER:", str(exc)[:90])
                  continue

              raws = re.findall(
                  r"<script[^>]*application/ld\+json[^>]*>(.*?)</script>", html, re.S)
              found, recipe = set(), None
              for raw in raws:
                  try:
                      data = json.loads(raw)
                  except Exception:
                      continue
                  types_of(data, found)
                  recipe = recipe or find_recipe(data)
              micro = html.count('itemprop="recipeIngredient"')
              print(f"  JSON-LD-Typen: {sorted(found) or 'keine'}")
              print(f"  Microdata recipeIngredient: {micro}")
              if recipe:
                  ing = recipe.get("recipeIngredient") or []
                  instr = recipe.get("recipeInstructions")
                  print(f"  RECIPE: Felder={sorted(recipe.keys())[:12]}")
                  print(f"    Zutaten({len(ing)}): {json.dumps(ing[:3], ensure_ascii=False)[:220]}")
                  print(f"    Anleitung: {type(instr).__name__} "
                        f"{json.dumps(instr, ensure_ascii=False)[:160]}")
                  for k in ("totalTime", "prepTime", "cookTime", "recipeYield"):
                      if recipe.get(k):
                          print(f"    {k}: {json.dumps(recipe[k], ensure_ascii=False)[:70]}")
          PYEOF
          python3 /tmp/recon.py
          exit 0
